<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown.md</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6feb">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/katex/katex.min.css">
<link id="hl-light" rel="stylesheet" href="lib/hljs/github.min.css">
<link id="hl-dark" rel="stylesheet" href="lib/hljs/github-dark.min.css" disabled>
<style>
:root{
  --bg:#fbfaf8;--panel:#f3f1ec;--text:#1f2328;--muted:#656d76;--line:#dcd8cf;
  --accent:#1f6feb;--code-bg:#f2f0eb;--active:#e3ebfa;--fs:17px;
  --c-blue:#1f6feb;--c-green:#1a7f37;--c-purple:#8250df;--c-amber:#9a6700;--c-red:#cf222e;--c-gray:#6e7781;
  --read:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c;--panel:#1d2025;--text:#e6e6e6;--muted:#9aa3ad;--line:#2e333a;
    --accent:#58a6ff;--code-bg:#22262c;--active:#1f2d44;
    --c-blue:#58a6ff;--c-green:#3fb950;--c-purple:#bc8cff;--c-amber:#d29922;--c-red:#f85149;--c-gray:#8b949e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c;--panel:#1d2025;--text:#e6e6e6;--muted:#9aa3ad;--line:#2e333a;
  --accent:#58a6ff;--code-bg:#22262c;--active:#1f2d44;
  --c-blue:#58a6ff;--c-green:#3fb950;--c-purple:#bc8cff;--c-amber:#d29922;--c-red:#f85149;--c-gray:#8b949e;
  color-scheme:dark;
}
body.serif{--read:Charter,"Sitka Text",Cambria,Georgia,serif}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* barra superior */
header{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.icon{padding:5px 9px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.primary:hover{filter:brightness(1.08)}
#docpath{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);padding:0 6px}
#docpath b{color:var(--text);font-weight:600}
.live{display:flex;align-items:center;gap:5px;color:var(--muted);white-space:nowrap;cursor:pointer}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
body.editing #bEdit{background:var(--active);border-color:var(--accent)}

/* layout */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr) auto;min-height:0}
body.nosb .layout{grid-template-columns:0 minmax(0,1fr) auto}
body.nosb aside{visibility:hidden}
aside{overflow:auto;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.sbhead{position:sticky;top:0;background:var(--panel);padding:10px;border-bottom:1px solid var(--line);z-index:1}
#filter{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
#filter:focus{outline:2px solid var(--accent);outline-offset:-1px}
#count{font-size:12px;color:var(--muted);margin-top:6px}
#list{list-style:none;margin:0;padding:6px 6px 30px}
#list .dir{font-size:11.5px;color:var(--muted);padding:10px 8px 3px;text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .file{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .file:hover{background:var(--active)}
#list .file.active{background:var(--active);color:var(--accent);font-weight:600}

main{overflow:auto;min-width:0;min-height:0;scroll-behavior:smooth}
#toc{width:240px;overflow:auto;border-left:1px solid var(--line);padding:18px 12px;font-size:13px}
#toc h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
#tocList a{display:block;color:var(--muted);text-decoration:none;padding:3px 6px;border-radius:5px;border-left:2px solid transparent}
#tocList a:hover{color:var(--text)}
#tocList a.on{color:var(--accent);border-left-color:var(--accent);background:var(--active)}
#tocList .lvl2{padding-left:14px}#tocList .lvl3{padding-left:24px}#tocList .lvl4{padding-left:34px}
@media (max-width:1200px){#toc{display:none}}

/* editor */
#editor{display:none;flex-direction:column;height:100%}
body.editing main{overflow:hidden}
body.editing article{display:none}
body.editing #editor{display:flex}
body.editing #toc{display:none}
.edbar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#edMsg{color:var(--muted);font-size:13px;flex:1;min-width:180px}
#edMsg .dirty{color:var(--c-amber);font-weight:600}
#edText{flex:1;width:100%;resize:none;border:0;outline:0;padding:22px 28px 60px;background:var(--bg);color:var(--text);
  font:15px/1.65 Consolas,"Cascadia Code",ui-monospace,monospace;tab-size:4}

/* conteúdo */
article{max-width:840px;margin:0 auto;padding:32px 28px 90px;font-family:var(--read);font-size:var(--fs);line-height:1.72;overflow-wrap:break-word}
article h1,article h2,article h3,article h4,article h5,article h6{line-height:1.3;margin:1.6em 0 .6em;scroll-margin-top:16px;font-family:"Segoe UI",system-ui,sans-serif}
article h1{font-size:1.9em;border-bottom:1px solid var(--line);padding-bottom:.25em}
article h2{font-size:1.45em;border-bottom:1px solid var(--line);padding-bottom:.2em}
article h3{font-size:1.2em}
article > :first-child{margin-top:0}
article a{color:var(--accent)}
article a.broken{color:var(--c-red);text-decoration:line-through dotted}
article a.wikilink{text-decoration:none;border-bottom:1px dashed var(--accent)}
article img{max-width:100%;height:auto;border-radius:6px}
.missing{display:inline-block;padding:4px 8px;border:1px dashed var(--c-red);border-radius:6px;color:var(--c-red);font-size:.85em}
article code{font-family:Consolas,"Cascadia Code",ui-monospace,monospace;font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
.codewrap{position:relative}
article pre{background:var(--code-bg);padding:14px 16px;border-radius:8px;overflow:auto;line-height:1.5;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
article pre code,article pre code.hljs{white-space:inherit;word-break:inherit;overflow-wrap:inherit}
article pre code{background:none;padding:0;font-size:.86em}
article pre code.hljs{background:none;padding:0}
.copy{position:absolute;top:8px;right:8px;font-size:12px;opacity:0;transition:opacity .15s}
.codewrap:hover .copy{opacity:1}
article blockquote{margin:1em 0;padding:.2em 1em;border-left:4px solid var(--line);color:var(--muted)}
.tablewrap{overflow-x:auto;margin:1em 0}
article table{border-collapse:collapse;font-size:.93em}
article th,article td{border:1px solid var(--line);padding:6px 11px;vertical-align:top}
article th{background:var(--panel)}
article tr:nth-child(2n) td{background:rgba(127,127,127,.07);background:color-mix(in srgb,var(--panel) 45%,transparent)}
article hr{border:0;border-top:1px solid var(--line);margin:2em 0}
article li > input[type=checkbox]{margin-right:.45em}
article ul:has(> li > input[type=checkbox]){list-style:none;padding-left:1.1em}
.mermaid{text-align:center;margin:1.2em 0}
.fnref a{text-decoration:none;font-size:.8em;padding:0 .1em}
.footnotes{font-size:.88em;color:var(--muted);margin-top:2.5em}
.footnotes li:target{color:var(--text)}
.fnback{text-decoration:none}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:.3em 0}

/* callouts */
.callout{border-left:4px solid var(--cc);background:rgba(127,127,127,.08);background:color-mix(in srgb,var(--cc) 9%,transparent);color:var(--text)!important;border-radius:0 8px 8px 0;padding:.6em 1em!important}
.callout-title{font-weight:700;color:var(--cc);margin-bottom:.25em;font-family:"Segoe UI",system-ui,sans-serif}
.callout > p:last-child{margin-bottom:.3em}
.cc-blue{--cc:var(--c-blue)}.cc-green{--cc:var(--c-green)}.cc-purple{--cc:var(--c-purple)}
.cc-amber{--cc:var(--c-amber)}.cc-red{--cc:var(--c-red)}.cc-gray{--cc:var(--c-gray)}

/* propriedades (front matter) */
details.fm{border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-bottom:1.6em;font-size:.85em;font-family:"Segoe UI",system-ui,sans-serif}
details.fm summary{cursor:pointer;color:var(--muted)}
details.fm table{margin:.5em 0 .3em;width:100%}
details.fm td{border:0;padding:3px 8px 3px 0}
details.fm td:first-child{color:var(--muted);white-space:nowrap;width:1%}

/* boas-vindas */
.welcome{max-width:620px;margin:6vh auto 0;font-family:"Segoe UI",system-ui,sans-serif;font-size:15px}
.welcome h1{border:0;font-size:2em;margin-bottom:.2em}
.welcome .lead{color:var(--muted);margin-top:0}
.welcome .actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.welcome .actions .btn{padding:10px 16px;font-size:15px}
.welcome ul{padding-left:1.2em;color:var(--muted)}
.welcome kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.85em;background:var(--panel)}

#drop{position:fixed;inset:0;background:rgba(31,111,235,.16);background:color-mix(in srgb,var(--accent) 16%,transparent);border:3px dashed var(--accent);
  display:none;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--accent);z-index:50;pointer-events:none}
#drop.show{display:flex}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;
  font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
#toast.show{opacity:.95}

/* telas estreitas */
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)!important}
  aside{position:fixed;top:47px;bottom:0;left:0;width:84vw;max-width:320px;z-index:40;transform:translateX(-100%);transition:transform .2s;visibility:visible!important;box-shadow:0 0 30px rgba(0,0,0,.25)}
  body.sbopen aside{transform:none}
  .hide-sm{display:none!important}
  article{padding:20px 16px 80px}
  #edText{padding:16px 14px 60px}
}

@media print{
  header,aside,#toc,.copy,#drop,#toast,#editor{display:none!important}
  body{display:block;overflow:visible;height:auto;background:#fff;color:#000}
  .layout{display:block}
  main{overflow:visible}
  article{max-width:none;padding:0;display:block!important}
  details.fm{display:none}
}

/* ===== visual v2 ===== */
.show-sm{display:none}
:root{--radius:12px;--shadow:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06);--grad:linear-gradient(135deg,#1f6feb,#6e8bff);--chip:#eef3fe}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--chip:#1b2a44}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--chip:#1b2a44}}
header{gap:8px;padding:9px 14px;background:var(--bg);border-bottom:0;box-shadow:0 1px 0 var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap;cursor:pointer;border:0;background:none;padding:2px 6px 2px 2px;border-radius:10px}
.brand:hover{background:var(--active)}
.brand svg{width:28px;height:28px;flex:none}
.btn{border-radius:9px;padding:6px 11px;transition:border-color .15s,background .15s,box-shadow .15s}
.btn:hover{box-shadow:0 1px 4px rgba(0,0,0,.08)}
.primary{background:var(--grad);border-color:transparent;color:#fff}
#docpath{display:flex;align-items:center;gap:6px}
#docpath .chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#docpath .meta{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside{background:var(--panel)}
.sbhead{padding:12px;border-bottom:0;background:var(--panel)}
#filter{border-radius:10px;padding:8px 11px;background:var(--bg)}
.sb-sec{padding:2px 6px 4px}
.sb-sec h5{display:flex;align-items:center;justify-content:space-between;margin:10px 8px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sb-sec h5 button{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:2px 6px;border-radius:6px;text-transform:none;letter-spacing:0}
.sb-sec h5 button:hover{color:var(--c-red);background:var(--active)}
.rlist{list-style:none;margin:0;padding:0}
.rec{position:relative;display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 30px 8px 8px;border-radius:10px;cursor:pointer;color:inherit}
.rec:hover{background:var(--active)}
.rec.cur{background:var(--active);box-shadow:inset 3px 0 0 var(--accent)}
.rec .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--chip);color:var(--accent);flex:none;font-size:15px}
.rec .tx{min-width:0;flex:1}
.rec .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .loc{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .tm{font-size:11px;color:var(--muted);margin-top:1px}
.rec .ed{display:inline-block;background:rgba(154,103,0,.14);color:var(--c-amber);border-radius:999px;padding:0 7px;font-size:10.5px;font-weight:700;margin-right:4px}
.rec .x{position:absolute;right:6px;top:8px;border:0;background:none;color:var(--muted);cursor:pointer;opacity:0;border-radius:6px;padding:0 6px;font-size:14px;line-height:22px}
.rec:hover .x,.rec:focus-within .x{opacity:1}
.rec .x:hover{color:var(--c-red);background:var(--bg)}
.empty{color:var(--muted);font-size:12.5px;padding:4px 10px 8px}
#list{padding:2px 8px 30px}
#list .file{border-radius:8px;padding:6px 10px}
#list .file::before{content:"📄";margin-right:7px;font-size:12px;opacity:.75}
#list .file.active{background:var(--active);box-shadow:inset 3px 0 0 var(--accent)}
#count{margin-top:8px}
article{max-width:800px}
article h1{border-bottom:0;padding-bottom:.15em;background:linear-gradient(var(--accent),var(--accent)) left bottom/56px 3px no-repeat}
article h2{border-bottom:1px solid var(--line)}
article blockquote{border-left-color:var(--accent);background:var(--active);border-radius:0 10px 10px 0;color:var(--text);padding:.5em 1em}
article pre{border-radius:var(--radius)}
article table{border-radius:var(--radius);overflow:hidden}
/* boas-vindas */
.welcome{max-width:760px;margin:5vh auto 0;font-size:15px}
.hero{display:flex;align-items:center;gap:18px;background:var(--grad);color:#fff;border-radius:20px;padding:24px 26px;box-shadow:var(--shadow)}
.hero svg{width:64px;height:64px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.hero svg rect{fill:rgba(255,255,255,.18)}
.hero h1{margin:0;font-size:1.9em;border:0;background:none;color:#fff;padding:0}
.hero p{margin:.3em 0 0;opacity:.92}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 6px}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;color:inherit}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .ci{font-size:24px}
.card b{font-size:16px}
.card small{color:var(--muted)}
.wsec{margin:24px 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rgrid .rec{border:1px solid var(--line);background:var(--bg);box-shadow:var(--shadow);padding:10px 30px 10px 10px}
.tips{margin-top:22px;border:1px solid var(--line);border-radius:14px;padding:10px 16px;background:var(--bg)}
.tips summary{cursor:pointer;font-weight:600}
.note{color:var(--muted);font-size:12.5px;margin-top:14px}
@media (max-width:820px){aside{top:52px}header{overflow-x:auto;scrollbar-width:none}header::-webkit-scrollbar{display:none}header>*{flex-shrink:0}.show-sm{display:inline!important}#docpath{display:none}.cards{grid-template-columns:1fr}.hero{padding:18px}.hero svg{width:48px;height:48px}}
</style>
</head>
<body>
<header>
  <button class="brand" id="bHome" title="Início"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="url(#mdg)"/><defs><linearGradient id="mdg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#6e8bff"/></linearGradient></defs><path d="M13 44V20h6l7 9 7-9h6v24h-6V30l-7 9-7-9v14z" fill="#fff"/><path d="M47 20h5v14h5l-7.5 10L42 34h5z" fill="#fff"/></svg><span class="hide-sm">Markdown.md</span></button>
  <button class="btn icon" id="bSide" title="Mostrar/ocultar lista (Ctrl+B)">☰</button>
  <button class="btn primary" id="bFolder" title="Abrir pasta (Ctrl+Shift+O)" aria-label="Abrir pasta"><span class="show-sm">📁</span><span class="hide-sm">Abrir pasta</span></button>
  <button class="btn hide-sm" id="bFiles" title="Abrir arquivos (Ctrl+O)">Abrir arquivos</button>
  <div id="docpath"></div>
  <button class="btn" id="bEdit" title="Editar este arquivo (Ctrl+E)" hidden>✎ Editar</button>
  <label class="live hide-sm" title="Recarrega sozinho quando o arquivo é salvo (Chrome/Edge, abrindo pelos botões)"><input type="checkbox" id="live" checked> Auto-atualizar</label>
  <span class="sep hide-sm"></span>
  <button class="btn icon" id="bSmaller" title="Diminuir fonte">A−</button>
  <button class="btn icon" id="bBigger" title="Aumentar fonte">A+</button>
  <button class="btn icon hide-sm" id="bFont" title="Alternar fonte serifada / sem serifa">Aa</button>
  <button class="btn icon" id="bTheme" title="Tema claro/escuro" aria-label="Tema claro/escuro"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  <button class="btn icon hide-sm" id="bPrint" title="Imprimir / salvar PDF (Ctrl+P)" aria-label="Imprimir"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg></button>
  <a class="btn hide-sm" id="bDownload" href="markdown-md.html" download="Markdown.md.html" title="Baixar como um único ficheiro HTML: abre direto no navegador, sem instalar">⬇ Baixar HTML</a>
  <button class="btn primary" id="bInstall" title="Instalar como app: abre arquivos .md com duplo clique" hidden>⤓ Instalar</button>
</header>

<div class="layout">
  <aside>
    <div class="sbhead">
      <input id="filter" type="search" placeholder="Filtrar arquivos… (Ctrl+K)" autocomplete="off">
      <div id="count">Nenhum arquivo aberto</div>
    </div>
    <section class="sb-sec" id="recentSec">
      <h5>Recentes <button id="rClear" title="Esquecer todos os recentes">limpar</button></h5>
      <ul class="rlist" id="recent"></ul>
    </section>
    <section class="sb-sec" id="listSec">
      <h5 id="listTitle">Nesta pasta</h5>
    </section>
    <ul id="list"></ul>
  </aside>
  <main id="content">
    <article id="article"></article>
    <section id="editor">
      <div class="edbar">
        <button class="btn primary" id="edSave" title="Guardar no arquivo original (Ctrl+S)">💾 Guardar</button>
        <button class="btn" id="edDone" title="Voltar à leitura (Ctrl+E)">👁 Ler</button>
        <button class="btn" id="edCancel" title="Descartar o que mudou desde a última gravação (Esc)">Descartar</button>
        <span id="edMsg"></span>
      </div>
      <textarea id="edText" spellcheck="true" lang="pt" aria-label="Texto do arquivo"></textarea>
    </section>
  </main>
  <nav id="toc" hidden>
    <h4>Nesta página</h4>
    <div id="tocList"></div>
  </nav>
</div>

<div id="drop">Solte arquivos ou uma pasta aqui</div>
<div id="toast"></div>
<input type="file" id="fileInput" multiple accept=".md,.markdown,.mdown,.mkd,.txt" hidden>
<input type="file" id="dirInput" webkitdirectory multiple hidden>

<!-- bibliotecas guardadas no próprio site (lib/): funcionam sem internet depois da 1ª visita -->
<script src="lib/marked.min.js"></script>
<script src="lib/purify.min.js"></script>
<script src="lib/hljs/highlight.min.js"></script>
<script src="lib/katex/katex.min.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="url(#mdg)"/><defs><linearGradient id="mdg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#6e8bff"/></linearGradient></defs><path d="M13 44V20h6l7 9 7-9h6v24h-6V30l-7 9-7-9v14z" fill="#fff"/><path d="M47 20h5v14h5l-7.5 10L42 34h5z" fill="#fff"/></svg>`;
const state = { files:new Map(), assets:new Map(), urls:new Map(), current:null, lastMod:0, rootName:'', rootHandle:null, noFSA:false,
                editing:false, editOrig:'', editCRLF:false, editBaseMod:0 };
const MD_EXT  = /\.(md|markdown|mdown|mkd|txt)$/i;
const IMG_EXT = /\.(png|jpe?g|gif|webp|svg|bmp|avif|ico)$/i;
const SKIP_DIR = new Set(['.git','.obsidian','.trash','node_modules','.stfolder','.stversions','.venv','__pycache__']);

/* ---------- utilidades ---------- */
const esc  = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const slug = s => String(s).trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu,'').replace(/\s/g,'-');
function norm(p){ const out=[]; for(const seg of String(p).replace(/\\/g,'/').split('/')){ if(!seg||seg==='.') continue; if(seg==='..') out.pop(); else out.push(seg); } return out.join('/'); }
const dirOf = p => { const i=p.lastIndexOf('/'); return i<0 ? '' : p.slice(0,i); };
const base  = p => p.slice(p.lastIndexOf('/')+1);
const safeDecode = s => { try{ return decodeURIComponent(s); }catch{ return s; } };
const narrow = () => matchMedia('(max-width:820px)').matches;
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3600); }
const pref = { get(k,d){ try{ const v=localStorage.getItem('markdownmd.'+k); return v===null?d:v; }catch{ return d; } },
               set(k,v){ try{ localStorage.setItem('markdownmd.'+k,v); }catch{} } };

/* ---------- biblioteca de arquivos ---------- */
function resetLib(name, rootHandle){
  for(const u of state.urls.values()) URL.revokeObjectURL(u);
  state.files.clear(); state.assets.clear(); state.urls.clear();
  state.current=null; state.rootName=name||''; state.rootHandle=rootHandle||null;
}
function addEntry(path, src){
  path = norm(path);
  if(MD_EXT.test(path)) state.files.set(path, src);
  else if(IMG_EXT.test(path)) state.assets.set(path, src);
}
// arquivo solto (fora de pasta): mesmo nome de outro arquivo vira "nome (2).md" em vez de substituir
async function sameSource(a, b){
  if(a.handle && b.handle){ try{ return await a.handle.isSameEntry(b.handle); }catch{ return false; } }
  const fa=a.file, fb=b.file;
  // sem handle não há como saber se é o mesmo arquivo: igual só se tamanho, data e conteúdo coincidem
  if(!(fa && fb && fa.size===fb.size && fa.lastModified===fb.lastModified)) return false;
  try{ return (await fa.text())===(await fb.text()); }catch{ return false; }
}
async function addLoose(name, src){
  let key=norm(name), n=1;
  const stem=key.replace(MD_EXT,''), ext=(key.match(MD_EXT)||[''])[0];
  while(state.files.has(key) && !(await sameSource(state.files.get(key), src))) key=`${stem} (${++n})${ext}`;
  addEntry(key, src);
  return key;
}
async function getFile(src){ return src.handle ? await src.handle.getFile() : src.file; }
async function walkHandle(dir, prefix){
  for await (const [name, h] of dir.entries()){
    if(h.kind==='directory'){ if(!SKIP_DIR.has(name)) await walkHandle(h, prefix+name+'/'); }
    else addEntry(prefix+name, {handle:h});
  }
}
function readAll(reader){
  return new Promise((res,rej)=>{ const all=[]; const next=()=>reader.readEntries(b=>{ if(!b.length) res(all); else { all.push(...b); next(); } }, rej); next(); });
}
async function walkEntry(entry, prefix){
  if(entry.isFile){ const f=await new Promise((r,j)=>entry.file(r,j)); addEntry(prefix+entry.name,{file:f}); }
  else if(entry.isDirectory && !SKIP_DIR.has(entry.name)){
    for(const k of await readAll(entry.createReader())) await walkEntry(k, prefix+entry.name+'/');
  }
}
function pickStart(){
  const keys=[...state.files.keys()];
  const pri=['readme.md','index.md','memoria-projeto.md','home.md'];
  for(const n of pri){ const k=keys.find(p=>!p.includes('/') && p.toLowerCase()===n); if(k) return k; }
  return keys.sort(sortPaths)[0] || null;
}
function sortPaths(a,b){
  const o={numeric:true,sensitivity:'base'};
  return dirOf(a).localeCompare(dirOf(b),'pt',o) || base(a).localeCompare(base(b),'pt',o);
}
async function afterLoad(prefer){
  renderList();
  if(!state.files.size){ toast('Nenhum arquivo Markdown encontrado.'); return; }
  const target = (prefer && state.files.has(norm(prefer))) ? norm(prefer) : (state.current && state.files.has(state.current) ? state.current : pickStart());
  if(target) await openPath(target);
  toast(`${state.files.size} arquivo(s) Markdown carregado(s).`);
}

async function openFolder(){
  if(!(await leaveEdit())) return;
  if(window.showDirectoryPicker && !state.noFSA){
    try{
      const dir = await showDirectoryPicker({mode:'read'});
      resetLib(dir.name, dir); await walkHandle(dir,''); await afterLoad();
    }catch(e){
      if(e.name==='AbortError') return;
      console.warn(e); state.noFSA=true;
      toast('O navegador bloqueou o acesso direto. Clique de novo para usar o modo alternativo.');
    }
  } else $('#dirInput').click();
}
async function openFiles(){
  if(!(await leaveEdit())) return;
  if(window.showOpenFilePicker && !state.noFSA){
    try{
      const hs = await showOpenFilePicker({multiple:true, types:[{description:'Markdown', accept:{'text/plain':['.md','.markdown','.mdown','.mkd','.txt']}}]});
      let first=null;
      for(const h of hs){ const k=await addLoose(h.name,{handle:h}); first=first||k; }
      await afterLoad(first);
    }catch(e){
      if(e.name==='AbortError') return;
      console.warn(e); state.noFSA=true;
      toast('O navegador bloqueou o acesso direto. Clique de novo para usar o modo alternativo.');
    }
  } else $('#fileInput').click();
}
$('#fileInput').addEventListener('change', async e=>{
  const fs=[...e.target.files]; let first=null;
  for(const f of fs){ const k=await addLoose(f.name,{file:f}); first=first||k; }
  e.target.value=''; if(fs.length) await afterLoad(first);
});
$('#dirInput').addEventListener('change', async e=>{
  const fs=[...e.target.files]; if(!fs.length) return;
  resetLib(fs[0].webkitRelativePath.split('/')[0]);
  for(const f of fs){
    const parts=f.webkitRelativePath.split('/').slice(1);
    if(parts.slice(0,-1).some(s=>SKIP_DIR.has(s))) continue;
    addEntry(parts.join('/'),{file:f});
  }
  e.target.value=''; await afterLoad();
});

/* arrastar e soltar */
const drop=$('#drop');
document.addEventListener('dragover', e=>{ if(state.editing) return; if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ e.preventDefault(); drop.classList.add('show'); } });
document.addEventListener('dragleave', e=>{ if(!e.relatedTarget || e.relatedTarget.nodeName==='HTML') drop.classList.remove('show'); });
document.addEventListener('drop', async e=>{
  if(state.editing) return;
  e.preventDefault(); drop.classList.remove('show');
  const items=[...e.dataTransfer.items].filter(i=>i.kind==='file');
  // tudo precisa ser capturado antes do primeiro await
  const hp = items.map(i=> i.getAsFileSystemHandle ? i.getAsFileSystemHandle() : null);
  const en = items.map(i=> i.webkitGetAsEntry ? i.webkitGetAsEntry() : null);
  const fl = [...e.dataTransfer.files];
  let first=null;
  try{
    if(!hp.length || !hp.every(Boolean)) throw 0;
    const hs=(await Promise.all(hp)).filter(Boolean);
    if(hs.length!==hp.length) throw 0;
    const dirs=hs.filter(h=>h.kind==='directory');
    if(dirs.length) resetLib(dirs.length===1 ? dirs[0].name : 'Várias pastas', dirs.length===1 ? dirs[0] : null);
    for(const h of hs){
      if(h.kind==='directory') await walkHandle(h, dirs.length>1 ? h.name+'/' : '');
      else { const k=await addLoose(h.name,{handle:h}); first=first||k; }
    }
  }catch{
    if(en.length && en.every(Boolean)){
      const dirs=en.filter(x=>x.isDirectory);
      if(dirs.length) resetLib(dirs.length===1 ? dirs[0].name : 'Várias pastas');
      for(const x of en){
        if(x.isDirectory && dirs.length===1){ for(const k of await readAll(x.createReader())) await walkEntry(k,''); }
        else { await walkEntry(x,''); if(x.isFile) first=first||x.name; }
      }
    } else { for(const f of fl){ const k=await addLoose(f.name,{file:f}); first=first||k; } }
  }
  await afterLoad(first);
});

/* ---------- lista lateral ---------- */
function renderList(){
  const q=fold($('#filter').value.trim());
  const ul=$('#list'); ul.innerHTML='';
  const paths=[...state.files.keys()].sort(sortPaths);
  let shown=0, lastDir=null;
  for(const p of paths){
    if(q && !fold(p).includes(q)) continue;
    const d=dirOf(p);
    if(d!==lastDir){ lastDir=d; if(d){ const li=document.createElement('li'); li.className='dir'; li.textContent=d.replace(/\//g,' › '); li.title=d; ul.append(li); } }
    const li=document.createElement('li'); const b=document.createElement('button');
    b.className='file'+(p===state.current?' active':''); b.textContent=base(p).replace(MD_EXT,''); b.title=p;
    b.onclick=async()=>{ if(!(await leaveEdit())) return; openPath(p); if(narrow()) document.body.classList.remove('sbopen'); };
    li.append(b); ul.append(li); shown++;
  }
  $('#listTitle').textContent = state.rootName ? 'Nesta pasta · '+state.rootName : (state.files.size ? 'Arquivos abertos' : 'Nesta pasta');
  $('#count').textContent = state.files.size
    ? (q ? `${shown} de ${state.files.size} arquivo(s)` : `${state.files.size} arquivo(s)${state.rootName?' em '+state.rootName:''}`)
    : 'Nenhum arquivo aberto';
}
$('#filter').addEventListener('input', renderList);
$('#filter').addEventListener('keydown', e=>{ if(e.key==='Enter'){ const b=$('#list .file'); if(b) b.click(); } });

/* ---------- abrir e renderizar ---------- */
// mermaid (~3 MB) só é carregado quando algum arquivo tem diagrama
let mermaidP=null;
function loadMermaid(){
  if(window.mermaid) return Promise.resolve();
  return mermaidP ||= new Promise(res=>{
    const s=document.createElement('script'); s.src='lib/mermaid.min.js';
    s.onload=res; s.onerror=()=>{ mermaidP=null; res(); }; document.head.append(s);
  });
}
async function openPath(p, keepScroll=false){
  const src=state.files.get(p); if(!src) return;
  let f; try{ f=await getFile(src); }catch(e){ toast('Não consegui ler: '+p); return; }
  const text=await f.text();
  const main=$('#content'); const y=main.scrollTop;
  state.current=p; state.lastMod=f.lastModified;
  await renderMarkdown(text, p);
  const words=(text.match(/[\p{L}\p{N}]+/gu)||[]).length;
  document.title = base(p).replace(MD_EXT,'')+' — Markdown.md';
  $('#docpath').innerHTML = `${state.rootName||dirOf(p)?`<span class="chip" title="${esc((state.rootName?state.rootName+'/':'')+dirOf(p))}">📁 ${esc([state.rootName,dirOf(p).replace(/\//g,' › ')].filter(Boolean).join(' › '))}</span>`:''}<b>${esc(base(p))}</b><span class="meta">· ${words.toLocaleString('pt-BR')} palavras · ~${Math.max(1,Math.round(words/200))} min</span>`;
  $('#bEdit').hidden=false;
  main.style.scrollBehavior='auto'; main.scrollTop = keepScroll ? y : 0; main.style.scrollBehavior='';
  renderList(); spy();
  if(!keepScroll) remember(p,false);
}

function preprocess(src){
  const codes=[], math=[];
  const keep = m => `\u0000${codes.push(m)-1}\u0000`;
  src = src.replace(/^ {0,3}(`{3,}|~{3,})[^\n]*\n[\s\S]*?^ {0,3}\1[`~]*[ \t]*$/gm, keep);   // blocos de código
  src = src.replace(/``[^\n]+?``|`[^`\n]+`/g, keep);                                           // código inline
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (_,t)=>`@@KTX${math.push({t,d:true})-1}@@`);        // $$ … $$
  src = src.replace(/(^|[^\\$\w])\$(?=\S)([^$\n]*?\S)\$(?![\w$])/g, (_,pre,t)=>`${pre}@@KTX${math.push({t,d:false})-1}@@`); // $ … $
  // Obsidian: ![[embed]]
  src = src.replace(/!\[\[([^\]|#]+?)(#[^\]|]*)?(\|[^\]]*)?\]\]/g, (_,name,anc,opt)=>{
    name=name.trim(); const o=opt?opt.slice(1).trim():'';
    if(IMG_EXT.test(name)){
      const w=/^\d+(x\d+)?$/.test(o) ? ` width="${o.split('x')[0]}"` : '';
      return `<img src="${esc(encodeURI(name))}" alt="${esc(w?name:(o||name))}"${w}>`;
    }
    return `<a href="#" class="wikilink" data-wiki="${esc(name)}" data-anchor="${esc(anc?anc.slice(1):'')}">↪ ${esc(o||name)}</a>`;
  });
  // Obsidian: [[link|apelido]]
  src = src.replace(/\[\[([^\]|#]*?)(#[^\]|]*)?(\|[^\]]*)?\]\]/g, (_,name,anc,opt)=>{
    name=(name||'').trim(); const a=anc?anc.slice(1).trim():'';
    const label = opt ? opt.slice(1).trim() : [name, a.replace(/^\^/,'')].filter(Boolean).join(' › ');
    return `<a href="#" class="wikilink" data-wiki="${esc(name)}" data-anchor="${esc(a)}">${esc(label)}</a>`;
  });
  // notas de rodapé [^id]
  const notes=[], seen=new Map();
  src = src.replace(/^\[\^([^\]\s]+)\]:[ \t]*(.*)$/gm, (_,id,t)=>{ notes.push({id,t}); return ''; });
  if(notes.length){
    src = src.replace(/\[\^([^\]\s]+)\]/g, (m,id)=>{
      const n=notes.findIndex(x=>x.id===id); if(n<0) return m;
      const k=slug(id)||String(n+1); seen.set(id,k);
      return `<sup class="fnref"><a href="#fn-${esc(k)}" id="fnref-${esc(k)}">${n+1}</a></sup>`;
    });
  }
  const restore = t => t.replace(/\u0000(\d+)\u0000/g, (_,i)=>codes[+i]).replace(/\u0000(\d+)\u0000/g, (_,i)=>codes[+i]);
  src = restore(src);
  for(const n of notes){ n.t=restore(n.t); n.k=seen.get(n.id)||slug(n.id); }
  return {text:src, math, notes};
}
function renderTex(m){
  if(!m) return '';
  if(window.katex){ try{ return katex.renderToString(m.t,{displayMode:m.d, throwOnError:false}); }catch{} }
  return esc(m.d ? `$$${m.t}$$` : `$${m.t}$`);
}
function renderFrontMatter(raw){
  const rows=[]; let last=null;
  for(const line of raw.split('\n')){
    const kv=line.match(/^([^\s:#][^:]*):\s*(.*)$/);
    const li=line.match(/^\s*-\s+(.*)$/);
    if(kv){ last={k:kv[1].trim(), v:kv[2].trim() ? [kv[2].trim()] : []}; rows.push(last); }
    else if(li && last) last.v.push(li[1].trim());
    else if(line.trim() && last) last.v.push(line.trim());
  }
  if(!rows.length) return '';
  const clean=v=>v.replace(/^\[|\]$/g,'').replace(/^["']|["']$/g,'');
  return `<details class="fm" open><summary>Propriedades</summary><table>${rows.map(r=>`<tr><td>${esc(r.k)}</td><td>${esc(r.v.map(clean).join(', '))}</td></tr>`).join('')}</table></details>`;
}

async function renderMarkdown(src, path){
  const art=$('#article');
  if(!window.marked || !window.DOMPurify){
    art.innerHTML=`<p><b>As bibliotecas não carregaram.</b> Na primeira visita é preciso internet para guardar os componentes no computador. Verifique a conexão e recarregue (F5).</p><pre>${esc(src)}</pre>`;
    return;
  }
  src=src.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  let fm='';
  const m=src.match(/^---\n([\s\S]*?)\n(?:---|\.\.\.)[ \t]*(?:\n|$)/);
  if(m){ fm=renderFrontMatter(m[1]); src=src.slice(m[0].length); }
  const {text, math, notes}=preprocess(src);
  let html=marked.parse(text,{gfm:true, breaks:false});
  if(notes.length) html+=`<section class="footnotes"><hr><ol>${notes.map(n=>`<li id="fn-${esc(n.k)}">${marked.parseInline(n.t)} <a href="#fnref-${esc(n.k)}" class="fnback">↩</a></li>`).join('')}</ol></section>`;
  html=DOMPurify.sanitize(html,{ADD_ATTR:['target']});
  html=html.replace(/@@KTX(\d+)@@/g,(_,i)=>renderTex(math[+i]));
  art.innerHTML=fm+html;
  await enhance(art, path);
}

const CALLOUT_NAME={note:'Nota',info:'Info',todo:'A fazer',tip:'Dica',hint:'Dica',success:'Sucesso',check:'Sucesso',done:'Concluído',
  important:'Importante',abstract:'Resumo',summary:'Resumo',tldr:'Resumo',example:'Exemplo',warning:'Atenção',caution:'Cuidado',
  attention:'Atenção',question:'Pergunta',faq:'Pergunta',help:'Ajuda',danger:'Perigo',error:'Erro',bug:'Bug',failure:'Falha',
  fail:'Falha',missing:'Faltando',quote:'Citação',cite:'Citação'};
function calloutColor(t){
  if(/^(tip|hint|success|check|done)$/.test(t)) return 'green';
  if(/^(important|abstract|summary|tldr|example)$/.test(t)) return 'purple';
  if(/^(warning|caution|attention|question|faq|help)$/.test(t)) return 'amber';
  if(/^(danger|error|bug|failure|fail|missing)$/.test(t)) return 'red';
  if(/^(quote|cite)$/.test(t)) return 'gray';
  return 'blue';
}
function resolveWiki(name){
  if(!name) return state.current;
  const keys=[...state.files.keys()];
  const full=fold(norm(name).replace(MD_EXT,''));
  const short=fold(base(norm(name)).replace(MD_EXT,''));
  return keys.find(p=>fold(p.replace(MD_EXT,''))===full)
      || keys.find(p=>fold(p.replace(MD_EXT,'')).endsWith('/'+full))
      || keys.find(p=>fold(base(p).replace(MD_EXT,''))===short) || null;
}
async function openWiki(name, anchor){
  const p=resolveWiki(name);
  if(!p){ toast('Nota não encontrada na pasta aberta: '+name); return; }
  if(p!==state.current) await openPath(p);
  if(anchor) scrollToId(slug(anchor.replace(/^\^/,'')));
}
function scrollToId(id){
  const el=document.getElementById(id) || document.getElementById(slug(safeDecode(id)));
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
async function assetURL(key, src){
  if(state.urls.has(key)) return state.urls.get(key);
  const f=await getFile(src); const u=URL.createObjectURL(f); state.urls.set(key,u); return u;
}

async function enhance(art, path){
  // títulos + sumário
  const used={}; const toc=$('#tocList'); toc.innerHTML='';
  art.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{
    let id=slug(h.textContent)||'secao';
    if(used[id]!==undefined){ used[id]++; id+='-'+used[id]; } else used[id]=0;
    h.id=id;
    if(/^H[1-4]$/.test(h.tagName) && !h.closest('blockquote')){
      const a=document.createElement('a'); a.href='#'+id; a.dataset.id=id; a.textContent=h.textContent; a.className='lvl'+h.tagName[1];
      a.onclick=e=>{ e.preventDefault(); scrollToId(id); }; toc.append(a);
    }
  });
  $('#toc').hidden = toc.children.length<2;

  // callouts (GitHub / Obsidian)
  art.querySelectorAll('blockquote').forEach(bq=>{
    const p=bq.firstElementChild; if(!p || p.tagName!=='P') return;
    const m=p.innerHTML.match(/^\s*\[!([\w-]+)\]([+-]?)[ \t]*([^\n]*)(\n|$)/); if(!m) return;
    const type=m[1].toLowerCase();
    p.innerHTML=p.innerHTML.slice(m[0].length); if(!p.innerHTML.trim()) p.remove();
    const t=document.createElement('div'); t.className='callout-title';
    if(m[3].trim()) t.innerHTML=m[3].trim(); else t.textContent=CALLOUT_NAME[type]||m[1];
    bq.classList.add('callout','cc-'+calloutColor(type)); bq.prepend(t);
  });

  // tabelas roláveis
  art.querySelectorAll('table').forEach(t=>{ if(t.closest('details.fm')) return; const w=document.createElement('div'); w.className='tablewrap'; t.replaceWith(w); w.append(t); });

  // mermaid
  const mm=[...art.querySelectorAll('pre > code.language-mermaid')];
  if(mm.length) await loadMermaid();
  if(mm.length && window.mermaid){
    const nodes=mm.map(c=>{ const d=document.createElement('div'); d.className='mermaid'; d.textContent=c.textContent; c.parentElement.replaceWith(d); return d; });
    try{ mermaid.initialize({startOnLoad:false, securityLevel:'strict', theme:isDark()?'dark':'default'}); await mermaid.run({nodes}); }catch(e){ console.warn(e); }
  }

  // código: realce + botão copiar
  art.querySelectorAll('pre > code').forEach(code=>{
    const lang=(code.className.match(/language-([\w+#.-]+)/)||[])[1];
    if(window.hljs && lang && hljs.getLanguage(lang)){ try{ hljs.highlightElement(code); }catch{} }
    const pre=code.parentElement; const w=document.createElement('div'); w.className='codewrap';
    pre.replaceWith(w); w.append(pre);
    const b=document.createElement('button'); b.className='btn copy'; b.textContent='Copiar';
    b.onclick=async()=>{
      try{ await navigator.clipboard.writeText(code.textContent); }
      catch{ const r=document.createRange(); r.selectNodeContents(code); const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges(); }
      b.textContent='Copiado ✓'; setTimeout(()=>b.textContent='Copiar',1400);
    };
    w.append(b);
  });

  // imagens locais
  for(const img of [...art.querySelectorAll('img')]){
    const s=img.getAttribute('src')||'';
    if(/^(https?:|data:|blob:)/i.test(s)){ img.loading='lazy'; continue; }
    const dec=safeDecode(s.split(/[?#]/)[0]);
    let key=norm(dirOf(path)+'/'+dec), src=state.assets.get(key);
    if(!src){ const b=base(dec).toLowerCase(); for(const [k,v] of state.assets){ if(base(k).toLowerCase()===b){ key=k; src=v; break; } } }
    if(src){ try{ img.src=await assetURL(key,src); continue; }catch{} }
    const span=document.createElement('span'); span.className='missing'; span.textContent='🖼 Imagem não encontrada: '+dec; img.replaceWith(span);
  }

  // links
  art.querySelectorAll('a').forEach(a=>{
    if(a.classList.contains('wikilink')){
      if(!resolveWiki(a.dataset.wiki)) a.classList.add('broken');
      a.onclick=e=>{ e.preventDefault(); openWiki(a.dataset.wiki, a.dataset.anchor); };
      return;
    }
    const href=a.getAttribute('href')||'';
    if(/^(https?:|mailto:|tel:)/i.test(href)){ a.target='_blank'; a.rel='noopener noreferrer'; return; }
    if(href.startsWith('#')){ a.onclick=e=>{ e.preventDefault(); scrollToId(safeDecode(href.slice(1))); }; return; }
    if(!href) return;
    const [p,h]=href.split('#');
    const target=norm(dirOf(path)+'/'+safeDecode(p));
    if(state.files.has(target)){
      a.onclick=async e=>{ e.preventDefault(); await openPath(target); if(h) scrollToId(safeDecode(h)); };
    } else if(MD_EXT.test(p)){
      const alt=resolveWiki(safeDecode(p));
      if(alt){ a.onclick=async e=>{ e.preventDefault(); await openPath(alt); if(h) scrollToId(safeDecode(h)); }; }
      else { a.classList.add('broken'); a.onclick=e=>{ e.preventDefault(); toast('Arquivo não encontrado na pasta aberta: '+safeDecode(p)); }; }
    }
  });
}

/* sumário acompanha a rolagem */
let spyRaf=0;
function spy(){
  const hs=[...$('#article').querySelectorAll('h1[id],h2[id],h3[id],h4[id]')];
  const top=$('#content').getBoundingClientRect().top+90; let cur=hs.length?hs[0].id:null;
  for(const h of hs){ if(h.getBoundingClientRect().top<=top) cur=h.id; else break; }
  $('#tocList').querySelectorAll('a').forEach(a=>a.classList.toggle('on', a.dataset.id===cur));
}

/* auto-atualização quando o arquivo é salvo (pausada durante a edição) */
setInterval(async()=>{
  if(!$('#live').checked || !state.current || document.hidden || state.editing) return;
  const src=state.files.get(state.current); if(!src || !src.handle) return;
  try{ const f=await src.handle.getFile(); if(f.lastModified!==state.lastMod) await openPath(state.current,true); }catch{}
},1500);

/* ---------- edição ---------- */
const isDirty = () => state.editing && $('#edText').value !== state.editOrig;
function edStatus(){
  const src=state.current && state.files.get(state.current);
  const where = src && src.handle ? 'Ao guardar, substitui o arquivo original.' : 'Aberto sem acesso direto ao arquivo: ao guardar, é descarregada uma cópia.';
  $('#edMsg').innerHTML = (isDirty() ? '<span class="dirty">● Alterações por guardar</span> · ' : 'Sem alterações · ') + esc(where);
}
async function startEdit(){
  if(!state.current || state.editing) return;
  const src=state.files.get(state.current);
  let f; try{ f=await getFile(src); }catch{ toast('Não consegui ler o arquivo para editar.'); return; }
  const text=await f.text();
  state.editCRLF=/\r\n/.test(text);
  state.editOrig=text.replace(/\r\n/g,'\n');
  state.editBaseMod=f.lastModified;
  const ta=$('#edText'); ta.value=state.editOrig;
  state.editing=true; document.body.classList.add('editing');
  $('#bEdit').textContent='👁 Ler'; $('#bEdit').title='Voltar à leitura (Ctrl+E)';
  edStatus(); ta.focus(); ta.setSelectionRange(0,0); ta.scrollTop=0;
}
function exitEdit(){
  state.editing=false; document.body.classList.remove('editing');
  $('#bEdit').textContent='✎ Editar'; $('#bEdit').title='Editar este arquivo (Ctrl+E)';
}
// devolve true se pode sair do modo edição (sem alterações ou o utilizador aceitou descartar)
async function leaveEdit(){
  if(!state.editing) return true;
  if(isDirty() && !confirm('Tem alterações por guardar neste arquivo.\n\nDescartar as alterações?')) return false;
  exitEdit(); return true;
}
async function backToReading(){
  if(!(await leaveEdit())) return;
  if(state.current) await openPath(state.current,true);
}
async function writableOK(src){
  const ask = async h => {
    if(!h || !h.queryPermission) return true;
    let p=await h.queryPermission({mode:'readwrite'});
    if(p!=='granted' && h.requestPermission) p=await h.requestPermission({mode:'readwrite'});
    return p==='granted';
  };
  if(state.rootHandle){ try{ if(await ask(state.rootHandle)) return true; }catch{} }
  return ask(src.handle);
}
async function saveEdit(){
  if(!state.editing || !state.current) return false;
  const p=state.current, src=state.files.get(p);
  const value=$('#edText').value;
  const out = state.editCRLF ? value.replace(/\n/g,'\r\n') : value;
  if(src.handle && src.handle.createWritable){
    try{
      const cur=await src.handle.getFile();
      if(cur.lastModified!==state.editBaseMod &&
         !confirm('Este arquivo foi alterado por outro programa (por exemplo, o Servus ou o Obsidian) depois de começar a editar.\n\nGuardar mesmo assim e substituir essa versão?')) return false;
      if(!(await writableOK(src))){ toast('Sem autorização para gravar. Nada foi alterado.'); return false; }
      const w=await src.handle.createWritable(); await w.write(out); await w.close();
      const f=await src.handle.getFile();
      state.editBaseMod=f.lastModified; state.lastMod=f.lastModified; state.editOrig=value;
      edStatus(); toast('Guardado ✓ '+base(p)); remember(p,true);
      return true;
    }catch(e){ console.warn(e); toast('Não consegui gravar: '+(e.message||e.name)); return false; }
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out],{type:'text/markdown;charset=utf-8'})); a.download=base(p);
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  state.editOrig=value; edStatus();
  toast('Cópia descarregada. Substitua o arquivo original por ela.');
  return true;
}
function discardEdit(){
  if(isDirty() && !confirm('Descartar o que mudou desde a última gravação?')) return;
  $('#edText').value=state.editOrig; backToReading();
}
$('#bEdit').onclick=()=>{ state.editing ? backToReading() : startEdit(); };
$('#edSave').onclick=saveEdit;
$('#edDone').onclick=backToReading;
$('#edCancel').onclick=discardEdit;
$('#edText').addEventListener('input', edStatus);
$('#edText').addEventListener('keydown', e=>{
  if(e.key==='Tab' && !e.ctrlKey && !e.altKey && !e.metaKey){
    e.preventDefault(); const t=e.target, s=t.selectionStart, en=t.selectionEnd;
    t.setRangeText('\t', s, en, 'end'); edStatus();
  }
});
window.addEventListener('beforeunload', e=>{ if(isDirty()){ e.preventDefault(); e.returnValue=''; } });

function toggleSide(){

  else { const off=document.body.classList.toggle('nosb'); pref.set('sidebar',off?'0':'1'); }
}
$('#bSide').onclick=toggleSide;
$('#content').addEventListener('click', ()=>{ if(narrow()) document.body.classList.remove('sbopen'); });

document.addEventListener('keydown', e=>{
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(mod && k==='s'){ e.preventDefault(); if(state.editing) saveEdit(); return; }
  if(mod && k==='e'){ e.preventDefault(); if(state.editing) backToReading(); else startEdit(); return; }
  if(state.editing){
    if(e.key==='Escape'){ e.preventDefault(); backToReading(); }
    return; // durante a edição, os outros atalhos ficam desligados
  }
  if(mod && e.shiftKey && k==='o'){ e.preventDefault(); openFolder(); }
  else if(mod && k==='o'){ e.preventDefault(); openFiles(); }
  else if(mod && k==='k'){ e.preventDefault(); if(narrow()) document.body.classList.add('sbopen'); else document.body.classList.remove('nosb'); $('#filter').focus(); $('#filter').select(); }
  else if(mod && k==='b'){ e.preventDefault(); toggleSide(); }
  else if(e.key==='Escape'){ document.body.classList.remove('sbopen'); }
});

/* ---------- recentes (IndexedDB; guarda o acesso para reabrir com 1 clique no Chrome/Edge) ---------- */
// Recentes: metadados em "recent"; handles do disco à parte em "handles", lidos só ao reabrir.
const RDB = {
  db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open('markdownmd',1); }catch(e){ return rej(e); }
    r.onupgradeneeded=()=>{ r.result.createObjectStore('recent',{keyPath:'id'}); r.result.createObjectStore('handles'); };
    r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }); },
  tx(store, mode, fn){ return this.open().then(db=>new Promise((res,rej)=>{ const t=db.transaction(store,mode); const out=fn(t.objectStore(store)); t.oncomplete=()=>res(out&&out.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); })); },
  async all(){ try{ return (await this.tx('recent','readonly', st=>st.getAll()))||[]; }catch{ return []; } },
  async put(rec, hs){ try{ await this.tx('recent','readwrite', st=>st.put(rec)); }catch(e){ console.warn('recentes:', e); return; }
    if(hs) try{ await this.tx('handles','readwrite', st=>st.put(hs, rec.id)); }catch(e){ console.warn('recentes (handles):', e); } },
  async handles(id){ try{ return await this.tx('handles','readonly', st=>st.get(id)); }catch{ return null; } },
  async del(id){ try{ await this.tx('recent','readwrite', st=>st.delete(id)); await this.tx('handles','readwrite', st=>st.delete(id)); }catch{} },
  async clear(){ try{ await this.tx('recent','readwrite', st=>st.clear()); await this.tx('handles','readwrite', st=>st.clear()); }catch{} }
};
const MAX_REC=20;
const recId = p => (state.rootName ? 'pasta:'+state.rootName+'/' : 'arq:')+p;
async function remember(p, edited){
  const src=state.files.get(p); if(!src) return;
  const id=recId(p), list=await RDB.all(), old=list.find(r=>r.id===id)||{};
  const hs = (state.rootHandle||src.handle) ? { rootHandle:state.rootHandle||null, fileHandle:src.handle||null } : null;
  await RDB.put({ id, name:base(p), path:p, folder:state.rootName||'', reopen: !!hs || !!old.reopen,
    opened:Date.now(), edited: edited ? Date.now() : (old.edited||null) }, hs);
  const all=(await RDB.all()).sort((a,b)=>b.opened-a.opened);
  for(const r of all.slice(MAX_REC)) await RDB.del(r.id);
  renderRecents();
}
function ago(t){
  if(!t) return ''; const s=(Date.now()-t)/1000;
  if(s<60) return 'agora'; if(s<3600) return `há ${Math.floor(s/60)} min`; if(s<86400) return `há ${Math.floor(s/3600)} h`;
  const d=Math.floor(s/86400); if(d===1) return 'ontem'; if(d<7) return `há ${d} dias`;
  return new Date(t).toLocaleDateString('pt-BR');
}
function recItem(r){
  const loc=[r.folder||'arquivo avulso', dirOf(r.path).replace(/\//g,' › ')].filter(Boolean).join(' › ');
  const when = r.edited && r.edited>=r.opened-1000 ? `<span class="ed">editado</span>${ago(r.edited)}` : (r.edited ? `aberto ${ago(r.opened)} · <span class="ed">editado</span>${ago(r.edited)}` : `aberto ${ago(r.opened)}`);
  const cur = state.current && recId(state.current)===r.id ? ' cur' : '';
  return `<li><div class="rec${cur}" role="button" tabindex="0" data-id="${esc(r.id)}" title="${esc(loc+' › '+r.name)}">
    <span class="ic">${r.reopen?'📄':'🗒️'}</span>
    <span class="tx"><div class="nm">${esc(r.name.replace(MD_EXT,''))}</div><div class="loc">📁 ${esc(loc)}</div><div class="tm">${when}</div></span>
    <button class="x" data-del="${esc(r.id)}" title="Remover dos recentes" aria-label="Remover">×</button></div></li>`;
}
async function renderRecents(){
  const list=(await RDB.all()).sort((a,b)=>Math.max(b.opened,b.edited||0)-Math.max(a.opened,a.edited||0));
  const side=$('#recent'), wel=$('#wRecent');
  side.innerHTML = list.length ? list.slice(0,8).map(recItem).join('') : '<div class="empty">Os arquivos que abrir aparecem aqui.</div>';
  $('#rClear').hidden=!list.length;
  if(wel) wel.innerHTML = list.length ? list.slice(0,12).map(r=>recItem(r).replace(/^<li>|<\/li>$/g,'')).join('') : '<div class="empty">Ainda não há recentes. Abra uma pasta ou um arquivo para começar.</div>';
}
async function ensurePerm(h, mode){
  if(!h) return false; if(!h.queryPermission) return true;
  let st=await h.queryPermission({mode}); if(st!=='granted' && h.requestPermission) st=await h.requestPermission({mode});
  return st==='granted';
}
async function reopen(id){
  if(!(await leaveEdit())) return;
  const r=(await RDB.all()).find(x=>x.id===id); if(!r) return;
  const h=r.reopen ? (await RDB.handles(id))||{} : {};
  if(h.rootHandle) r.rootHandle=h.rootHandle; if(h.fileHandle) r.fileHandle=h.fileHandle;
  try{
    if(r.rootHandle && await ensurePerm(r.rootHandle,'read')){
      resetLib(r.rootHandle.name, r.rootHandle); await walkHandle(r.rootHandle,'');
      if(!state.files.has(norm(r.path))) toast(`"${r.name}" já não está em ${r.folder} (movido ou apagado).`);
      await afterLoad(r.path); return;
    }
    if(r.fileHandle && await ensurePerm(r.fileHandle,'read')){
      const k=await addLoose(r.fileHandle.name,{handle:r.fileHandle}); await afterLoad(k); return;
    }
  }catch(e){ console.warn(e); }
  toast(`Não consegui reabrir "${r.name}" diretamente. Use Abrir pasta ou Abrir arquivos.`);
}
document.addEventListener('click', async e=>{
  const del=e.target.closest('[data-del]'); if(del){ e.stopPropagation(); await RDB.del(del.dataset.del); renderRecents(); return; }
  const it=e.target.closest('.rec[data-id]'); if(it){ await reopen(it.dataset.id); if(narrow()) document.body.classList.remove('sbopen'); }
});
document.addEventListener('keydown', e=>{ const it=e.target.closest && e.target.closest('.rec[data-id]'); if(it && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); reopen(it.dataset.id); } });
$('#rClear').onclick=async()=>{ if(confirm('Esquecer todos os arquivos recentes? (Os arquivos não são apagados.)')){ await RDB.clear(); renderRecents(); } };
setInterval(()=>{ if(!document.hidden) renderRecents(); }, 60000);

renderWelcome();

/* ---------- app instalado: abrir .md pelo Windows (duplo clique / "Abrir com") ---------- */
// Com launch_handler "focus-existing", cada arquivo chega a esta mesma janela e entra na lista.
async function openLaunched(handles){
  let first=null;
  for(const h of handles){
    if(h.kind!=='file' || !MD_EXT.test(h.name)) continue;
    let key=null;
    // se o arquivo estiver dentro da pasta aberta, usa o caminho real (links [[wiki]] e imagens funcionam)
    if(state.rootHandle){ try{ const parts=await state.rootHandle.resolve(h); if(parts && parts.length){ key=norm(parts.join('/')); addEntry(key,{handle:h}); } }catch{} }
    if(!key) key=await addLoose(h.name,{handle:h});
    first=first||key;
  }
  if(!first) return;
  renderList();
  if(isDirty()){ toast('Arquivo adicionado à lista. Guarde ou descarte a edição atual para abri-lo.'); return; }
  if(state.editing) exitEdit();
  await openPath(first);
}
if('launchQueue' in window){
  launchQueue.setConsumer(p=>{ if(p.files && p.files.length) openLaunched(p.files); });
}
